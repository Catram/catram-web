{{ define "main" }}
<div class="container">
  <div class="card-deck mb-3 text-center">
    {{ range hugo.Data.ca }}
    <div class="card mb-4 shadow-sm">
      <div class="card-header">
        <h4 class="my-0 font-weight-normal">{{ .name }}</h4>
      </div>
      <div class="card-body">
        <p class="card-text">{{ .description }}</p>
        <a href="/{{ .certificate }}">Certificate</a>
        <a href="/{{ .crl }}">CRL</a>
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
